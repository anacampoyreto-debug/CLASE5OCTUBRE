<script>
const sections=[
{id:'word',nav:'1 · Word formation',title:'Formación de palabras',sub:'Detecta qué categoría gramatical pide el hueco y construye la forma correcta.',badge:'VOCABULARIO + GRAMÁTICA',intro:`<p>En <b>Word Formation</b>, primero mira la palabra anterior y posterior al hueco. La posición suele decirte si necesitas un sustantivo, un adjetivo, un adverbio o un verbo. Después decide si hace falta un prefijo, un sufijo o un cambio ortográfico.</p><div class="callout"><strong>Like no siempre significa “gustar”</strong><div>En <i>people like me</i>, like significa “como / parecido a”. En <i>people like going to the beach</i>, like es el verbo “gustar”. <i>Unlike</i> significa “a diferencia de”.</div></div><div class="step"><b>1</b><div>Localiza la palabra que acompaña al hueco y pregunta: <i>¿qué función cumple?</i></div></div><div class="step"><b>2</b><div>Forma la palabra y comprueba si necesita plural, prefijo negativo o cambio de terminación.</div></div><div class="step"><b>3</b><div>Lee la frase completa: el significado y la gramática deben encajar.</div></div>`,examples:[
['I was delighted when I heard I had won a holiday in Acapulco.','ai woz di-LAI-tid wen ai hɜːd ai had wʌn ə Hɒ-lə-dei in ə-kə-PUL-kə','Me alegré mucho cuando oí que había ganado unas vacaciones en Acapulco.'],
'We’ve got visitors coming to our house later this evening.'.split('|').length?['We’ve got visitors coming to our house later this evening.','wiːv ɡɒt VI-zi-təz Kʌ-ming tə aʊə haʊs LEI-tə dis Iːv-ning','Tenemos visitas que vienen a casa más tarde esta tarde.']:[],
['The highest mountain in Africa is Mount Kilimanjaro.','ðə HAI-ist MAʊn-tin in A-fri-kə iz maʊnt ki-li-mən-JA-rəʊ','La montaña más alta de África es el monte Kilimanjaro.'],
['People like me like going to the beach.','PIː-pəl laik miː laik GƏʊ-ing tə ðə biːtʃ','A personas como yo les gusta ir a la playa. (Primer like = “como”; segundo like = “gustar”.)'],
['Dan is actually very nice, unlike his father.','dæn iz ÆK-tʃu-ə-li VE-ri nais, ʌn-LAIK hiz Fɑː-ðə','Dan en realidad es muy agradable, a diferencia de su padre.'],
['This is easier than travelling by bicycle.','ðis iz Iː-zi-ə ðæn TRÆ-və-ling bai BAI-si-kəl','Esto es más fácil que viajar en bicicleta. (Easy → easier antes de than.)'],
['The old house is nearly falling down and it’s completely uninhabited.','ði əʊld haʊs iz NIə-li Fɔː-ling daʊn ænd its kəm-PLIːt-li ʌn-in-HA-bi-tid','La casa antigua está casi derrumbándose y está completamente deshabitada.'],
['There are restrictions on car use in a growing number of cities.','ðeər ə ri-STRIK-shənz ɒn kɑː juːs in ə GRƏU-ing Nʌm-bə əv SI-tiz','Hay restricciones al uso del coche en un número creciente de ciudades.'],
['The most attractive thing about the countryside here is the river valley.','ðə məʊst ə-TRAK-tiv θing ə-BAʊt ðə Kʌn-tri-said hiər iz ðə RI-və VA-li','Lo más atractivo del campo aquí es el valle del río.'],
['Clothes are important in this nightclub and people are always fashionably dressed.','kləʊðz ə im-Pɔː-tənt in ðis NAIT-klʌb ænd PIː-pəl əːr ɔːl-weiz FA-shən-ə-bli drest','La ropa es importante en esta discoteca y la gente siempre va vestida a la moda.'],
['The owner of that island is extremely wealthy; he’s worth a billion dollars.','ði əʊ-nə əv ðæt AI-lənd iz ik-STRIːm-li WEL-θi; hiːz wɜːθ ə BI-li-ən Dɒ-ləz','El dueño de esa isla es extremadamente rico; tiene una fortuna de mil millones de dólares.']
],vocab:[['inhabit','verbo: habitar'],['inhabitant(s)','sustantivo: habitante(s)'],['inhabited','adjetivo/participio: habitado'],['uninhabited','deshabitado: un- + inhabited'],['grow → growth','crecer → crecimiento'],['wide → width','ancho → anchura'],['strong → strength','fuerte → fuerza'],['long → length','largo → longitud'],['deep → depth','profundo → profundidad'],['high → height','alto → altura; cambia el orden de letras'],['attract → attractive','atraer → atractivo'],['fashion → fashionable','moda → a la moda'],['wealth → wealthy','riqueza → rico'],['sleep → sleepy','sueño → somnoliento'],['noise → noisy','ruido → ruidoso'],['helpful → helpless','útil → desamparado / indefenso'],['hopeful → hopeless','esperanzado → desesperanzado'],['endless','sin fin; end + -less'],['decide → decision','decidir → decisión; cambio de ortografía'],['easy → easily','fácil → fácilmente; y cambia a i'] ],quiz:[
{type:'completar huecos',prompt:'The old house is nearly falling down and it is completely ___.',phon:'ði əʊld haʊs iz NIə-li Fɔː-ling daʊn ænd it iz kəm-PLIːt-li ___',es:'La casa antigua está casi derrumbándose y está completamente ___.',answer:'uninhabited',hint:'“Falling down” describe una casa en la que nadie vive. Combina el prefijo negativo con inhabited.',why:'Necesitamos el adjetivo “deshabitado”: un- + inhabited = uninhabited. Se conservan prefijo y sufijo de la familia inhabit.'},
{type:'formación de palabras',prompt:'The ___ mountain in Africa is Mount Kilimanjaro. (HIGH)',phon:'ðə ___ MAʊn-tin in A-fri-kə iz maʊnt ki-li-mən-JA-rəʊ',es:'La montaña más ___ de África es el monte Kilimanjaro.',answer:'highest',hint:'Después de “the” y con una comparación dentro del grupo, usa el superlativo.',why:'High tiene superlativo highest. La y de high cambia de posición en height, pero no en highest.'},
{type:'formación de palabras',prompt:'The number of emails has increased ___. (STEADY)',phon:'ðə Nʌm-bə əv Iː-meilz hæz in-KRIːst ___',es:'El número de correos electrónicos ha aumentado ___.',answer:'steadily',hint:'¿Cómo ha aumentado? Necesitas un adverbio que modifique increased.',why:'Steadily es el adverbio formado a partir de steady. Al terminar en consonante + y, la y cambia a i antes de -ly.'}
]},
{id:'errors',nav:'2 · Fix the mistakes',title:'Corrige los errores',sub:'Revisa categoría, prefijos y ortografía antes de cambiar la frase.',badge:'FIRST · CORRECCIÓN',intro:`<p>En este ejercicio algunas palabras se parecen al español, pero no son correctas en inglés. Lee el contexto, identifica qué función pide la frase y reescribe la palabra problemática. No cambies el resto de la oración.</p><div class="callout"><strong>Atención a las trampas de la clase</strong><div><i>-ful</i> suele escribirse con una sola <i>l</i>; ante consonante, <i>y</i> suele pasar a <i>i</i>; y el prefijo negativo depende de la palabra. No existe una regla sin excepciones.</div></div>`,examples:[
['Thanks for the weekend; everything was wonderful.','θæŋks fə ðə wiːk-END; EV-ri-thing wəz WʌN-də-fəl','Gracias por el fin de semana; todo fue maravilloso.'],
['Many students study education and can find a job easily when they graduate.','ME-ni STJUː-dənts STʌ-di e-dju-KEI-shən ænd kən faind ə dʒɒb Iː-zə-li wen ðei GRÆ-dʒu-eit','Muchos estudiantes estudian y pueden encontrar trabajo fácilmente cuando se gradúan.'],
['Car accidents are mainly due to inappropriate speed and careless driving.','kɑː ÆK-si-dənts ə MEIN-li djuː tə in-ə-PROʊ-pri-ət spiːd ænd KEə-ləs DRAI-ving','Los accidentes de coche se deben principalmente a una velocidad inadecuada y a una conducción descuidada.']
],quiz:[
{type:'corregir error',prompt:'Thanks for the weekend, everything was wonderfull.',phon:'θæŋks fə ðə wiːk-END, EV-ri-thing wəz WʌN-də-fəl',es:'Gracias por el fin de semana; todo fue maravilloso.',answer:'wonderful',hint:'Fíjate en el sufijo -ful. ¿Cuántas eles tiene en esta palabra?',why:'La forma correcta es wonderful, con una sola l. El sufijo -ful se escribe con una l. En wonderfully sí aparecen dos: la l de -ful y la de -ly.'},
{type:'corregir error',prompt:'Many students can find a job easyly when they graduate.',phon:'ME-ni STJUː-dənts kən faind ə dʒɒb ___ wen ðei GRÆ-dʒu-eit',es:'Muchos estudiantes pueden encontrar trabajo fácilmente cuando se gradúan.',answer:'easily',hint:'Aquí hace falta un adverbio. La palabra base termina en consonante + y.',why:'Easy → easily: la y cambia a i antes de -ly.'},
{type:'corregir error',prompt:'I will help my family with the preparatives for this event.',phon:'ai wil help mai FÆ-mə-li wið ðə ___ fə ðis i-VENT',es:'Ayudaré a mi familia con los preparativos para este evento.',answer:'preparations',hint:'El sustantivo habitual para “preparativos” en esta frase no se forma con -ives.',why:'La forma idiomática es preparations. Preparatives no funciona en este contexto.'},
{type:'corregir error',prompt:'The restaurant offers quality, nutritious food and a variety menu.',phon:'ðə RES-tə-rɒnt ɒ-fəz KWA-li-ti, nju-TRI-shəs fuːd ænd ə ___ MEN-juː',es:'El restaurante ofrece comida de calidad y nutritiva, y un menú variado.',answer:'varied',hint:'El hueco describe al sustantivo “menu”; ¿qué categoría gramatical necesitas?',why:'Variety es un sustantivo. Para describir menu se necesita el adjetivo varied.'},
{type:'corregir error',prompt:'If we received a complainment from the Tourist Board, they would be given the sack immediately.',phon:'if wi ri-SIːvd ə ___ frəm ðə TUə-rist bɔːd, ðei wəd bi GI-vən ðə sæk i-MIː-di-ət-li',es:'Si recibiéramos una queja de la oficina de turismo, los despedirían inmediatamente.',answer:'complaint',hint:'El verbo es complain, pero el sustantivo no se forma añadiendo -ment.',why:'La palabra es complaint (queja). “They would be given the sack” significa “los despedirían”; está en pasiva.'},
{type:'corregir error',prompt:'I would recommend this game to unexperienced players who like solving mysteries.',phon:'ai wəd re-kə-MEND ðis geim tə ___ PLEI-əz huː laik SɒL-ving MIS-tə-riz',es:'Recomendaría este juego a jugadores sin experiencia a quienes les gusta resolver misterios.',answer:'inexperienced',hint:'El prefijo negativo aquí es in-, no un-.',why:'Inexperienced significa “sin experiencia / inexperto”. Un- es frecuente, pero no sirve para todas las palabras.'},
{type:'corregir error',prompt:'The international airport is the most impressing I have ever seen.',phon:'ði in-tə-NÆ-shə-nəl Eə-pɔːt iz ðə məʊst ___ ai hæv E-və siːn',es:'El aeropuerto internacional es el más impresionante que he visto.',answer:'impressive',hint:'La frase describe cómo es el aeropuerto, no lo que el aeropuerto está haciendo.',why:'Impressive describe algo que causa impresión. Impressed suele describir cómo se siente una persona.'},
{type:'corregir error',prompt:'If you are determinated and focus on your aim, nothing will prevent you from achieving it.',phon:'if juː ə ___ ænd FƏʊ-kəs ɒn jɔː eim, Nʌ-θing wil pri-VENT juː frəm ə-CHIː-ving it',es:'Si eres una persona decidida y te centras en tu objetivo, nada te impedirá alcanzarlo.',answer:'determined',hint:'La expresión es “be determined”.',why:'Determined significa decidido. Además, prevent someone from doing something = impedir/evitar que alguien haga algo; después de from va -ing.'},
{type:'corregir error',prompt:'The waitress was rude and unpolite.',phon:'ðə WEI-trəs wəz ruːd ænd ___',es:'La camarera fue grosera y maleducada.',answer:'impolite',hint:'Ante p, muchos negativos se forman con im-, aunque hay excepciones.',why:'Impolite es la forma negativa correcta. Pleasant, por ejemplo, no sigue ese patrón: unpleasant.'},
{type:'corregir error',prompt:'Car accidents are mainly due to inappropriate speed and uncarefully driving.',phon:'kɑː ÆK-si-dənts ə MEIN-li djuː tə in-ə-PROʊ-pri-ət spiːd ænd ___ DRAI-ving',es:'Los accidentes se deben a una velocidad inadecuada y a una conducción descuidada.',answer:'careless',hint:'Driving es un sustantivo verbal. Necesita un adjetivo; el negativo de careful se forma con -less.',why:'Careful → careless. “Carelessly” sería un adverbio y no describe aquí al sustantivo driving.'}
]},
{id:'emails',nav:'3 · Too many emails',title:'Lectura: Too many emails',sub:'Forma las palabras del texto y reconoce prefijos, sufijos y cambios ortográficos.',badge:'READING + WORD FORMATION',intro:`<p>El texto presenta cómo el correo electrónico llegó a ser abrumador para algunas personas. En la captura se leen con claridad los huecos 17–23. El ejercicio 24 aparece anunciado en una nota, pero la frase y la palabra base quedan fuera del recorte; está señalado abajo como ilegible, sin inventar una respuesta.</p><div class="sourceflag"><b>Parte no recuperable con seguridad:</b> la frase completa del ejercicio 24 está recortada. Las notas manuscritas apuntan a <i>decision</i> (decisión), que sí está incluida en la familia de palabras. En una captura de formación, el OCR mezcló columnas y no permite alinear todas las bases a su oración con certeza; por eso identifico como práctica nueva los ejemplos reescritos y no los presento como transcripción literal. La transcripción automática también confundía palabras como <i>like/light</i> y <i>growth/growing</i>; aquí están corregidas según el contexto y las notas.</div>`,examples:[
['Some years ago, there were predictions that email would soon be replaced as the most common means of online communication by social networking sites.','sʌm jɪəz ə-GƏʊ, ðeə wə pri-DIK-shənz ðæt Iː-meil wəd suːn bi ri-PLEIST æz ðə məʊst Kɒ-mən miːnz əv ɒn-LAIN kə-mjuː-ni-KEI-shən bai SƏU-shəl NET-wɜː-king saits','Hace algunos años, se predecía que el correo electrónico pronto sería reemplazado como medio de comunicación online más común por las redes sociales.'],
['Since then, however, the number of emails sent has increased steadily, to the point that the volume received on a daily basis has become stressful for many people.','sins ðen, haʊ-E-və, ðə Nʌm-bə əv Iː-meilz sent hæz in-KRIːst STED-i-li, tə ðə point ðæt ðə VɒL-juːm ri-SIːvd ɒn ə DEI-li BEI-sis hæz bi-Kʌm STRES-fəl fə ME-ni PIː-pəl','Desde entonces, sin embargo, el número de correos enviados ha aumentado de forma constante, hasta el punto de que el volumen diario recibido resulta estresante para muchas personas.'],
['For some users, the situation has become so unbearable that they regularly delete all the emails they receive without even bothering to read them, which is rather risky, to say the least.','fə sʌm JUː-zəz, ðə si-tju-EI-shən hæz bi-Kʌm səʊ ʌn-BEə-rə-bəl ðæt ðei REG-jə-lə-li di-LIːT ɔːl ði Iː-meilz ðei ri-SIːv wið-Aʊt Iː-vən Bɒ-ðə-ring tə riːd ðem, wɪtʃ iz RÆ-ðə RIS-ki, tə ðə liːst','Para algunos usuarios, la situación se ha vuelto tan insoportable que borran habitualmente todos los correos sin siquiera molestarse en leerlos, lo cual es bastante arriesgado, por decir lo menos.'],
['A less extreme measure is to install software that sorts incoming mail into different categories.','ə les ik-STRIːm ME-zhə iz tə in-STɔːl SɒFT-weə ðæt sɔːts IN-kʌ-ming meil IN-tə DIF-rənt KA-tə-gə-riz','Una medida menos extrema es instalar un programa que clasifica el correo entrante en distintas categorías.'],
['Promotions from commercial organisations go into a separate folder from messages arriving from friends or employers, enabling us to see which emails are important.','prə-MƏU-shənz frəm kə-Mɜː-shəl ɔː-gə-nai-ZEI-shənz gəʊ IN-tə ə SE-pə-rət FƏʊL-də frəm ME-sə-dʒiz ə-RAI-ving frəm frendz ɔː im-PLƆI-əz, i-NEI-bling ʌs tə siː wɪtʃ Iː-meilz ə im-PƆː-tənt','Las promociones de organizaciones comerciales van a una carpeta separada de los mensajes de amigos o empleadores, lo que nos permite ver qué correos son importantes.']
],quiz:[
{type:'completar huecos',prompt:'The number of emails sent has increased ___. (STEADY)',phon:'ðə Nʌm-bə əv Iː-meilz sent hæz in-KRIːst ___',es:'El número de correos enviados ha aumentado ___.',answer:'steadily',hint:'Modifica el verbo increased: necesitas un adverbio.',why:'Steadily = de forma constante. Es steady + -ly, con cambio de y a i.'},
{type:'completar huecos',prompt:'The volume received daily has become ___ for many people. (STRESS)',phon:'ðə VɒL-juːm ri-SIːvd DEI-li hæz bi-Kʌm ___ fə ME-ni PIː-pəl',es:'El volumen recibido a diario se ha vuelto ___ para muchas personas.',answer:'stressful',hint:'Se describe la situación que causa estrés. El sufijo -ful forma adjetivos.',why:'Stressful significa “estresante”. El sufijo -ful se escribe con una sola l.'},
{type:'completar huecos',prompt:'The situation has become so ___ that users delete all their emails. (BEAR)',phon:'ðə si-tju-EI-shən hæz bi-Kʌm səʊ ___ ðæt JUː-zəz di-LIːT ɔːl ðeər Iː-meilz',es:'La situación se ha vuelto tan ___ que los usuarios borran todos sus correos.',answer:'unbearable',hint:'El texto pide prefijo y sufijo: negativo + “que se puede soportar”.',why:'Unbearable = un- + bear + -able. El prefijo convierte “soportable” en “insoportable”.'},
{type:'completar huecos',prompt:'Deleting every message without reading it is rather ___. (RISK)',phon:'di-LIː-ting EV-ri ME-sidʒ wið-Aʊt RIː-ding it iz RÆ-ðə ___',es:'Borrar todos los mensajes sin leerlos es bastante ___.',answer:'risky',hint:'Aquí necesitas un adjetivo derivado de risk.',why:'Risk → risky. Se añade -y al sustantivo para formar el adjetivo risky.'},
{type:'completar huecos',prompt:'Promotions from ___ organisations go into a separate folder. (COMMERCE)',phon:'prə-MƏU-shənz frəm ___ ɔː-gə-nai-ZEI-shənz gəʊ IN-tə ə SE-pə-rət FƏʊL-də',es:'Las promociones de organizaciones ___ van a una carpeta separada.',answer:'commercial',hint:'El hueco describe organisations: hace falta un adjetivo.',why:'Commerce → commercial. Se conserva la e en commerce al añadir -ial: commercial.'},
{type:'completar huecos',prompt:'Separate folders are ___ us to see which emails matter. (ABLE)',phon:'SE-pə-rət FƏʊL-də ə ___ ʌs tə siː wɪtʃ Iː-meilz MÆ-tə',es:'Las carpetas separadas nos ___ ver qué correos importan.',answer:'enabling',hint:'Después de la coma, la frase resume el efecto. Forma enable y úsalo en -ing.',why:'Able → enable → enabling. El prefijo en- forma el verbo y -ing presenta el resultado: “permitiéndonos”.'},
{type:'elegir respuesta',prompt:'“Social ___ sites” needs a compound noun.',phon:'SƏU-shəl ___ saits',es:'“Sitios de ___ social”.',choices:['networking','networked','networker'],answer:'networking',hint:'La colocación habitual que aparece en el texto es “social networking sites”.',why:'Social networking sites = redes sociales. Es una combinación estable.'}
]},
{id:'contrast',nav:'4 · Solos + contraste',title:'On my own, by myself y conectores',sub:'Habla de hacer algo sin ayuda y contrasta dos ideas con la estructura adecuada.',badge:'EXPRESIONES + LINKING WORDS',intro:`<h3>Hacer algo a solas o sin ayuda</h3><p><b>by + pronombre reflexivo</b> y <b>on + adjetivo posesivo + own</b> suelen significar “solo/a” o “por mí mismo/a”. Se usan con personas y también con cosas. El pronombre concuerda con el sujeto.</p><h3>Conectores de contraste</h3><p>Although / even though introducen una oración con sujeto y verbo. Though puede ir al final con tono más informal. Despite / in spite of son preposiciones: van seguidos de un sustantivo, de verbo en -ing o de <i>the fact that + oración</i>. However y nevertheless enlazan dos oraciones completas y suelen ir tras punto seguidos de coma.</p>`,examples:[
['On Saturday nights I hate staying in by myself.','ɒn SÆ-tə-dei naits ai heit STEI-ing in bai mai-SELF','Los sábados por la noche odio quedarme en casa sola.'],
['I can do it on my own.','ai kən duː it ɒn mai əʊn','Puedo hacerlo por mi cuenta.'],
['The robot vacuum is cleaning by itself.','ðə RƏʊ-bɒt VÆK-juːm iz KLIː-ning bai it-SELF','El robot aspirador está limpiando solo.'],
['Although it was cold, we swam in the sea.','ɔːl-ðəʊ it wəz kəʊld, wi swæm in ðə siː','Aunque hacía frío, nadamos en el mar.'],
['We swam in the sea, although it was cold.','wi swæm in ðə siː, ɔːl-ðəʊ it wəz kəʊld','Nadamos en el mar, aunque hacía frío.'],
['Despite carrying an umbrella, I got completely wet.','di-SPAIT KÆ-ri-ing ən ʌm-BRE-lə, ai gɒt kəm-PLIːt-li wet','A pesar de llevar un paraguas, me empapé por completo.'],
['Despite the fact that I was carrying an umbrella, I got completely wet.','di-SPAIT ðə fækt ðæt ai wəz KÆ-ri-ing ən ʌm-BRE-lə, ai gɒt kəm-PLIːt-li wet','A pesar de que llevaba un paraguas, me empapé por completo.'],
['It was cold. However, we swam in the sea.','it wəz kəʊld. haʊ-E-və, wi swæm in ðə siː','Hacía frío. Sin embargo, nadamos en el mar.'],
['We swam in the sea, though.','wi swæm in ðə siː, ðəʊ','Nadamos en el mar, eso sí / aunque.']
],quiz:[
{type:'elegir respuesta',prompt:'I hate staying in ___ Saturday nights. I do not want company.',phon:'ai heit STEI-ing in ___ SÆ-tə-dei naits',es:'Odio quedarme en casa ___ los sábados por la noche. No quiero compañía.',choices:['by myself','by my own','on myself'],answer:'by myself',hint:'La estructura lleva by + pronombre reflexivo.',why:'By myself = sola / por mí misma. On my own también sería correcto, pero aquí no aparece entre las opciones.'},
{type:'completar huecos',prompt:'Despite ___ an umbrella, I got completely wet. (CARRY)',phon:'di-SPAIT ___ ən ʌm-BRE-lə, ai gɒt kəm-PLIːt-li wet',es:'A pesar de ___ un paraguas, me empapé por completo.',answer:'carrying',hint:'Despite funciona como preposición; después de preposición, el verbo va en -ing.',why:'Despite carrying an umbrella: despite + gerundio.'},
{type:'elegir respuesta',prompt:'It was cold. ___, we swam in the sea.',phon:'it wəz kəʊld. ___, wi swæm in ðə siː',es:'Hacía frío. ___, nadamos en el mar.',choices:['However','Despite','Although'],answer:'However',hint:'Tras punto y al principio de la segunda oración, con coma, usa el adverbio de enlace.',why:'However enlaza dos oraciones independientes y suele ir seguido de coma. Although necesita una oración subordinada.'},
{type:'ordenar palabras',prompt:'Ordena para decir: «Aunque hacía frío, nadamos en el mar».',phon:'Ordena: Although / cold / it / was / we / swam / in / the / sea',es:'Aunque hacía frío, nadamos en el mar.',answer:'Although it was cold we swam in the sea',accepted:['Although it was cold, we swam in the sea'],hint:'Although + sujeto + verbo, coma, oración principal.',why:'Although introduce la primera oración completa. Cuando va al principio, se escribe coma antes de la oración principal.'}
]},
{id:'wish',nav:'5 · Wish',title:'Wish: lamento presente, pasado y queja',sub:'Elige el tiempo según cuándo ocurre la situación que lamentas.',badge:'GRAMÁTICA PASO A PASO',intro:`<div class="step"><b>1</b><div><b>Wish + sujeto + past simple</b>: lamento una situación presente que quisiera distinta. En estilo más cuidado se puede usar were para todos los sujetos.</div></div><div class="step"><b>2</b><div><b>Wish + sujeto + past perfect</b>: lamento algo que ocurrió o no ocurrió en el pasado.</div></div><div class="step"><b>3</b><div><b>Wish + sujeto + would + infinitivo</b>: queja o deseo de que alguien cambie una conducta.</div></div><p class="note">El pasado de la forma verbal no siempre habla de un momento pasado: en el primer patrón, marca distancia respecto a la realidad presente.</p>`,examples:[
['I wish I were taller.','ai wish ai wɜː TƆː-lə','Ojalá fuera más alta. (Lamento presente.)'],
['I wish you had told me the truth.','ai wish juː hæd təʊld miː ðə truːθ','Ojalá me hubieras dicho la verdad. (Lamento pasado.)'],
['I wish you would stop smoking.','ai wish juː wəd stɒp SMƏʊ-king','Ojalá dejaras de fumar. / Quisiera que dejaras de fumar. (Queja o deseo de cambio.)'],
['Harry wishes he had got up earlier yesterday.','HÆ-ri WI-shiz hi hæd gɒt ʌp ɜː-li-ə YES-tə-dei','Harry desearía haberse levantado más temprano ayer.']
],quiz:[
{type:'elegir respuesta',prompt:'Harry wishes he ___ up earlier yesterday.',phon:'HÆ-ri WI-shiz hi ___ ʌp ɜː-li-ə YES-tə-dei',es:'Harry desearía haberse levantado más temprano ayer.',choices:['got','had got','would get'],answer:'had got',hint:'Yesterday marca que el lamento se refiere al pasado.',why:'Para un lamento pasado: wish + past perfect (had + participio).'},
{type:'completar huecos',prompt:'I wish I ___ taller. (BE)',phon:'ai wish ai ___ TƆː-lə',es:'Ojalá fuera más alta.',answer:'were',accepted:['was'],hint:'Es un deseo sobre la situación presente. Usa past simple; were es la forma tradicional en este patrón.',why:'Wish + past simple expresa un deseo sobre el presente. En uso informal también puede aparecer was con I; para el examen, were es la opción segura.'},
{type:'transformación',keyword:'WISH',prompt:'I’m sorry I didn’t tell you the truth. → I ___ you the truth.',phon:'aim Sɒ-ri ai DID-ənt tel juː ðə truːθ. → ai ___ juː ðə truːθ',es:'Siento no haberte dicho la verdad. → Ojalá te hubiera dicho la verdad.',answer:'wish I had told',hint:'El lamento es sobre algo pasado: wish + past perfect.',why:'I wish I had told you the truth. En la transformación con palabra clave, incluye WISH sin modificar y cuenta entre 2 y 5 palabras solo para el hueco del ejercicio.'}
]},
{id:'time',nav:'6 · Since / for',title:'Since y for con present perfect',sub:'Since señala el inicio; for expresa cuánto tiempo dura el periodo.',badge:'TIEMPO + TRANSFORMACIÓN',intro:`<div class="step"><b>1</b><div><b>since + punto de inicio</b>: since 2020, since Monday, since I moved.</div></div><div class="step"><b>2</b><div><b>for + periodo</b>: for six months, for years, for a long time.</div></div><div class="step"><b>3</b><div>Al transformar “Hace X que no…”, suele usarse present perfect + for + periodo. El pasado simple después de since expresa el momento de inicio.</div></div>`,examples:[
['I haven’t swum in the sea for years.','ai HÆ-vənt swʌm in ðə siː fə jɪəz','Hace años que no nado en el mar.'],
['I haven’t been to the salon since I had my haircut there six months ago.','ai HÆ-vənt biːn tə ðə SÆ-lɒn sins ai hæd mai HEə-kʌt ðeə siks mʌnθs ə-GƏʊ','No voy a la peluquería desde que me corté el pelo allí hace seis meses.']
],quiz:[
{type:'elegir respuesta',prompt:'I have wanted to go to India ___ years, but I never have.',phon:'ai hæv WɒN-tid tə gəʊ tə IN-di-ə ___ jɪəz, bʌt ai NE-və hæv',es:'He querido ir a la India ___ años, pero nunca he ido.',choices:['for','since'],answer:'for',hint:'Years es un periodo, no un punto de inicio.',why:'For + periodo de tiempo. Since + fecha o momento de inicio.'},
{type:'transformación',keyword:'FOR',prompt:'I last swam in the sea years ago. → I haven’t swum in the sea ___.',phon:'ai lɑːst swæm in ðə siː jɪəz ə-GƏʊ. ai HÆ-vənt swʌm in ðə siː ___',es:'La última vez que nadé en el mar fue hace años. → Hace años que no nado en el mar.',answer:'for years',hint:'La frase termina con un periodo. Usa FOR, exactamente así.',why:'For years = durante años / desde hace años. En este tipo de transformación, la respuesta debe conservar la palabra clave y tener de 2 a 5 palabras.'},
{type:'completar huecos',prompt:'I have lived here ___ 2021.',phon:'ai hæv livd hiə ___ TWEN-ti TWEN-ti-Wʌn',es:'Vivo aquí desde 2021.',answer:'since',hint:'2021 es un punto de inicio.',why:'Since + punto de inicio; for + duración.'}
]},
{id:'reported',nav:'7 · Reported speech',title:'Reported speech: preguntas indirectas',sub:'Cuenta lo que alguien preguntó, ajustando orden, pronombres y tiempo verbal.',badge:'ESTILO INDIRECTO',intro:`<div class="step"><b>1</b><div>Empieza con el sujeto + asked + la persona a quien preguntó.</div></div><div class="step"><b>2</b><div>Si la pregunta empieza con palabra interrogativa, consérvala (where, what, when…). Si es una pregunta de sí/no, añade if o whether.</div></div><div class="step"><b>3</b><div>Después usa orden afirmativo: sujeto + verbo. Al reportar desde el pasado, el tiempo suele retroceder un paso.</div></div><div class="step"><b>4</b><div>Cambia pronombres y referencias temporales si el contexto lo exige: tomorrow puede pasar a the following day.</div></div>`,examples:[
['“Are you going to the party?” Ingrid asked me.','ɑː juː GƏʊ-ing tə ðə Pɑː-ti? IN-grid ɑːskt miː','«¿Vas a ir a la fiesta?», me preguntó Ingrid.'],
['Ingrid asked me if I was going to the party.','IN-grid ɑːskt miː if ai wəz GƏʊ-ing tə ðə Pɑː-ti','Ingrid me preguntó si iba a ir a la fiesta.'],
['He asked me where I lived.','hi ɑːskt miː weə ai livd','Me preguntó dónde vivía.']
],quiz:[
{type:'transformación',keyword:'IF',prompt:'“Will you come?” she asked me. → She asked me ___ come.',phon:'“wil juː kʌm?” ʃi ɑːskt miː. → ʃi ɑːskt miː ___ kʌm',es:'«¿Vendrás?», me preguntó. → Me preguntó ___ venir.',answer:'if I would',hint:'Es una pregunta de sí/no: usa if. Pasa you a I y am going a was going.',why:'She asked me if I would come. Es una pregunta de sí/no: se añade if, se cambia you a I y will retrocede a would. El orden es afirmativo.'},
{type:'completar huecos',prompt:'“Where do you live?” → She asked me where I ___.',phon:'“weə duː juː liv?” → ʃi ɑːskt miː weə ai ___',es:'«¿Dónde vives?» → Me preguntó dónde ___.',answer:'lived',hint:'Pregunta con where: conserva where y usa orden sujeto + verbo. Retrocede el presente simple.',why:'Where I lived: no hay inversión en la pregunta indirecta; do desaparece y live pasa a lived.'}
]},
{id:'conditionals',nav:'8 · Conditionals',title:'Condicionales 1, 2 y 3',sub:'Busca primero el tiempo verbal que ya aparece: te orienta sobre el patrón.',badge:'GRAMÁTICA + TRANSFORMACIÓN',intro:`<div class="step"><b>1</b><div><b>First conditional:</b> If + present simple, will + infinitivo. Posible o probable: If you study, you will pass.</div></div><div class="step"><b>2</b><div><b>Second conditional:</b> If + past simple, would + infinitivo. Situación hipotética: If you studied, you would pass.</div></div><div class="step"><b>3</b><div><b>Third conditional:</b> If + past perfect, would have + participio. Hipótesis imposible de cambiar en el pasado: If you had studied, you would have passed.</div></div><p>En la primera condicional puede aparecer también un imperativo o present perfect en la cláusula con if. Para el examen, identifica primero el patrón base y luego comprueba que ambas mitades encajan.</p>`,examples:[
['If you study, you will pass.','if juː STʌ-di, juː wil pɑːs','Si estudias, aprobarás.'],
['If you studied, you would pass.','if juː STʌ-did, juː wəd pɑːs','Si estudiaras, aprobarías.'],
['If you had studied, you would have passed.','if juː hæd STʌ-did, juː wəd hæv pɑːst','Si hubieras estudiado, habrías aprobado.']
],quiz:[
{type:'completar huecos',prompt:'If I ___ Callum’s address, I would have written to him. (HAVE)',phon:'if ai ___ KÆ-ləmz ə-DRES, ai wəd hæv RI-tən tə him',es:'Si hubiera tenido la dirección de Callum, le habría escrito.',answer:'had had',hint:'“Would have written” señala una hipótesis irreal del pasado.',why:'Tercera condicional: If + past perfect, would have + participio. Have se convierte en had had.'},
{type:'transformación',keyword:'IF',prompt:'I didn’t have Callum’s address, so I didn’t write. → I would have written to him ___ his address.',phon:'ai DID-ənt hæv KÆ-ləmz ə-DRES, səʊ ai DID-ənt rait. → ai wəd hæv RI-tən tə him ___ hiz ə-DRES',es:'No tenía la dirección de Callum y no le escribí. → Le habría escrito si ___ su dirección.',answer:'if I had found',hint:'Tercera condicional: la condición va en past perfect. No cambies el significado original.',why:'If I had found his address = si hubiera encontrado su dirección. Third conditional: if + past perfect, would have + participio.'},
{type:'elegir respuesta',prompt:'If you ___ hard, you will pass the exam.',phon:'if juː ___ hɑːd, juː wil pɑːs ði ig-ZÆM',es:'Si estudias mucho, aprobarás el examen.',choices:['study','studied','had studied'],answer:'study',hint:'Will pass marca una posibilidad futura real.',why:'First conditional: if + present simple, will + infinitivo.'}
]},
{id:'choices',nav:'9 · Choose the answer',title:'Elige la alternativa correcta',sub:'Aplica la regla a la frase y explica por qué las otras opciones no encajan.',badge:'REPASO DE EXAMEN',intro:`<p>Estas frases proceden de la captura “Choose the correct words in italics”. Algunas cuestiones se refieren a construcciones que Leti dijo que se estudiarían con más detalle en otra clase; las marco como “vista previa”, sin atribuirles una explicación completa en esta sesión.</p>`,examples:[],quiz:[
{type:'elegir respuesta',prompt:'I have wanted to go to India ___ years, but never have.',phon:'ai hæv WɒN-tid tə gəʊ tə IN-di-ə ___ jɪəz, bʌt NE-və hæv',es:'He querido ir a la India ___ años, pero nunca he ido.',choices:['for','since'],answer:'for',hint:'Years expresa una duración.',why:'For + periodo de tiempo; since + punto de inicio.'},
{type:'elegir respuesta',prompt:'The girl came and asked me if I ___ dance with her.',phon:'ðə gɜːl keim ænd ɑːskt miː if ai ___ dɑːns wið hə',es:'La chica vino y me preguntó si ___ bailar con ella.',choices:['will','would'],answer:'would',hint:'El verbo que introduce el estilo indirecto está en pasado.',why:'En estilo indirecto, will suele retroceder a would.'},
{type:'elegir respuesta',prompt:'The town was very beautiful. I wish you ___ there to admire its beauty.',phon:'ðə taʊn wəz VE-ri BJUː-ti-fəl. ai wish juː ___ ðeə tə əd-MAI-ə its BJUː-ti',es:'El pueblo era muy bonito. Ojalá ___ allí para admirar su belleza.',choices:['were','had been'],answer:'had been',hint:'El pueblo ya era bonito en un momento pasado; se lamenta no haber estado allí.',why:'El deseo se refiere al pasado: wish + past perfect (had been).'},
{type:'elegir respuesta',prompt:'The people are really friendly even ___ you don’t speak their language.',phon:'ðə PIː-pəl ə RIə-li FREN-dli even ___ juː dəʊnt spiːk ðeə LÆN-gwidʒ',es:'La gente es muy amable incluso ___ no hables su idioma.',choices:['if','though'],answer:'if',hint:'El sentido es “incluso si no hablas su idioma”.',why:'Even if introduce una condición posible o hipotética. Even though expresa contraste con un hecho.'},
{type:'elegir respuesta',prompt:'The local café is said ___ the oldest coffee machine in the country.',phon:'ðə LƏʊ-kəl KÆ-fei iz sed ___ ði ƏʊL-dist Kɒ-fi mə-SHIːn in ðə KʌN-tri',es:'Se dice que la cafetería local ___ la máquina de café más antigua del país.',choices:['has','to have'],answer:'to have',hint:'Esta es la construcción impersonal “is said to…”.',why:'Is said to have = se dice que tiene. Leti señaló que la pasiva impersonal se explicaría en otra clase.'},
{type:'elegir respuesta',prompt:'I think you will still have fun ___ your own and make friends there.',phon:'ai θiŋk juː wil stil hæv fʌn ___ jɔː əʊn ænd meik frendz ðeə',es:'Creo que aun así te divertirás ___ y harás amigos allí.',choices:['by','on'],answer:'on',hint:'La expresión de la captura es “on your own”.',why:'On your own = por tu cuenta. By yourself también existe, pero no se mezcla: no se dice “by your own”.'},
{type:'elegir respuesta',prompt:'I haven’t been to the salon since I ___ my haircut there six months ago.',phon:'ai HÆ-vənt biːn tə ðə SÆ-lɒn sins ai ___ mai HEə-kʌt ðeə siks mʌnθs ə-GƏʊ',es:'No voy a la peluquería desde que ___ allí hace seis meses.',choices:['cut my hair','had my haircut'],answer:'had my haircut',hint:'“Had my haircut” significa que otra persona te cortó el pelo. Es la estructura causativa.',why:'Have something done expresa que otra persona realiza el servicio. La causativa se estudiará en una clase específica.'},
{type:'elegir respuesta',prompt:'Even ___ the firework display wasn’t exciting, I think it was a great event.',phon:'Iː-vən ___ ðə FAI-ə-wɜːk di-SPEI wɒz-ənt ik-SAI-ting, ai θiŋk it wəz ə greit i-VENT',es:'Aunque el espectáculo de fuegos artificiales no fue emocionante, creo que fue un gran evento.',choices:['so','though'],answer:'though',hint:'Delante de una oración con sujeto y verbo, escoge el conector que significa “aunque”.',why:'Even though + sujeto + verbo. Even so equivale a “aun así” y enlaza una idea independiente.'}

{id:'practice',nav:'10 · Practica y repasa',title:'Entrenamiento final',sub:'Escribe, ordena, escucha y habla. Primero inténtalo; después compara con la solución.',badge:'PRÁCTICA MIXTA',intro:`<p>Las respuestas se guardan en este dispositivo. Si fallas, la actividad se añade al repaso de errores. Puedes volver a intentarla tantas veces como necesites.</p><div class="callout"><strong>Pista para las transformaciones 25–30</strong><div>25 <i>as long as</i> puede sustituir a if; 26 practica la causativa <i>get + objeto + participio</i>; 27 recuerda <i>blame … on</i>; 28 usa <i>wish + past perfect</i>; 29 combina dos formas pasivas; 30 expresa una condición irreal del pasado. Cada hueco admite de 2 a 5 palabras, incluida la palabra clave, que se conserva sin cambios.</div></div>`,examples:[
['Despite the rain, we went for a walk.','di-SPAIT ðə rein, wi went fə ə wɔːk','A pesar de la lluvia, salimos a pasear.'],
['If you had called me, I would have helped you.','if juː hæd kɔːld miː, ai wəd hæv helpt juː','Si me hubieras llamado, te habría ayudado.']
],quiz:[
{type:'ordenar palabras',prompt:'Ordena estas palabras para formar una pregunta indirecta: “She asked me ___”.',phon:'where / I / lived / she / asked / me',es:'Me preguntó dónde vivía.',answer:'She asked me where I lived',accepted:['She asked me where I lived'],hint:'En una pregunta indirecta, después de where usa orden afirmativo: sujeto + verbo.',why:'She asked me where I lived. No se usa inversión “where did I live” dentro de la pregunta indirecta.'},
{type:'traducción',prompt:'Traduce al inglés: «A pesar de sentirme cansada, estudié para el examen».',phon:'La pronunciación y la traducción de la solución aparecerán después de responder.',es:'A pesar de sentirme cansada, estudié para el examen.',solution:'Despite feeling tired, I studied for the exam.',solutionPhon:'di-SPAIT FIː-ling TAI-əd, ai STʌ-did fə ði ig-ZÆM',solutionEs:'A pesar de sentirme cansada, estudié para el examen.',answer:'Despite feeling tired, I studied for the exam',accepted:['Although I was tired, I studied for the exam'],hint:'Puedes traducir “a pesar de + verbo” con despite + verbo en -ing, o usar although + sujeto + verbo.',why:'Una solución es “Despite feeling tired, I studied for the exam.” También es válida “Although I was tired, I studied for the exam.”'},
{type:'dictado',prompt:'Listen and write the sentence exactly.',phon:'LI-sən ænd rait ðə SEN-təns ig-ZÆKT-li',es:'Escucha y escribe la frase exactamente.',answer:'Although it was cold we swam in the sea',accepted:['Although it was cold, we swam in the sea'],solution:'Although it was cold, we swam in the sea.',solutionPhon:'ɔːl-ðəʊ it wəz kəʊld, wi swæm in ðə siː',solutionEs:'Aunque hacía frío, nadamos en el mar.',hint:'Escucha el conector inicial y separa las dos ideas.',why:'Although it was cold, we swam in the sea. Aunque hacía frío, nadamos en el mar.'},
{type:'listening',prompt:'What does the speaker say?',phon:'wɒt dəz ðə SPIː-kə sei?',es:'¿Qué dice la voz?',audio:'Despite carrying an umbrella, I got completely wet.',solution:'Despite carrying an umbrella, I got completely wet.',solutionPhon:'di-SPAIT KÆ-ri-ing ən ʌm-BRE-lə, ai gɒt kəm-PLIːt-li wet',solutionEs:'A pesar de llevar un paraguas, me empapé por completo.',choices:['A pesar de llevar un paraguas, me empapé por completo.','Aunque hacía calor, no me mojé.','Llevé un paraguas porque estaba lloviendo.'],answer:'A pesar de llevar un paraguas, me empapé por completo.',hint:'Escucha primero el conector y después qué ocurrió a pesar de llevar algo.',why:'Despite carrying an umbrella, I got completely wet. Despite + gerundio significa “a pesar de + infinitivo”.'},
{type:'speaking',prompt:'Say this sentence aloud. Use the microphone if your browser supports speech recognition.',phon:'sei ðis SEN-təns ə-LAʊd. juːz ðə MAI-krə-fəʊn if jɔː BRAʊ-zə sə-PƆːts spiːtʃ rek-əg-NI-shən',es:'Di esta frase en voz alta. Usa el micrófono si tu navegador admite reconocimiento de voz.',solution:'If I had studied, I would have passed.',solutionPhon:'if ai hæd STʌ-did, ai wəd hæv pɑːst',solutionEs:'Si hubiera estudiado, habría aprobado.',answer:'If I had studied I would have passed',accepted:['If I had studied, I would have passed'],hint:'Toca “Hablar” para que el navegador intente transcribir tu voz. También puedes escribir lo que has dicho.',why:'La estructura es tercera condicional: If + past perfect, would have + participio.'},
{type:'transformación',keyword:'LONG',prompt:'“I’ll take you to the station if you’re ready,” my brother said. → My brother said he’d take me to the station ___ ready.',phon:'“ail teik juː tə ðə STEI-shən if jɔː RE-di,” mai BRʌ-ðə sed. → mai BRʌ-ðə sed hiːd teik miː tə ðə STEI-shən ___ RE-di',es:'«Te llevaré a la estación si estás listo», dijo mi hermano. → Mi hermano dijo que me llevaría a la estación ___ listo.',answer:'as long as I was',hint:'Busca una expresión que pueda sustituir a if. Ajusta los pronombres y el tiempo verbal al estilo indirecto.',why:'My brother said he’d take me to the station as long as I was ready. As long as equivale a “siempre que”. Son cinco palabras y LONG queda intacta.'},
{type:'transformación',keyword:'GET',prompt:'My bike needs repairing again. → I’ll have to ___ again.',phon:'mai baik niːdz ri-PEə-ring ə-GEN. → ail hæv tə ___ ə-GEN',es:'Mi bicicleta necesita otra reparación. → Tendré que ___ otra vez.',answer:'get it repaired',hint:'¿Qué estructura expresa que otra persona hace algo por nosotros? Usa get + objeto + participio.',why:'I’ll have to get it repaired again. Get + objeto + participio es una causativa. La captura del ejercicio muestra esta estructura, aunque Leti dijo que la explicaría en otra clase.'},
{type:'transformación',keyword:'FALL',prompt:'The firm said profits had fallen on account of the recession. → The firm blamed ___ the recession.',phon:'ðə fɜːm sed PRɒ-fits hæd FƆː-lən ɒn ə-KAʊNT əv ðə ri-SE-shən. → ðə fɜːm bleimd ___ ðə ri-SE-shən',es:'La empresa dijo que los beneficios habían caído a causa de la recesión. → La empresa culpó a la recesión de ___ .',answer:'the fall in profits on',hint:'El sustantivo relacionado con fall es fall. Recuerda la estructura blame X on Y.',why:'The firm blamed the fall in profits on the recession. La palabra clave FALL se conserva y la respuesta del hueco tiene cinco palabras.'},
{type:'transformación',keyword:'WISHED',prompt:'Sigourney regretted spending so much in the shops. → Sigourney ___ less in the shops.',phon:'si-GƆː-ni ri-GRE-tid SPEN-ding səʊ mʌtʃ in ðə ʃɒps. → si-GƆː-ni ___ les in ðə ʃɒps',es:'Sigourney se arrepintió de gastar tanto en las tiendas. → Sigourney ___ menos en las tiendas.',answer:'wished she had spent',hint:'Regretted + gerundio describe un lamento pasado. Usa wish + past perfect.',why:'Sigourney wished she had spent less in the shops. La respuesta del hueco tiene cuatro palabras y conserva WISHED.'},
{type:'transformación',keyword:'HAVE',prompt:'People believe that poem was written about these beautiful hills. → That poem ___ written about these beautiful hills.',phon:'PIː-pəl bi-LIːv ðæt PƏʊ-im wəz RI-tən ə-BAʊt ðiːz BJUː-ti-fəl hilz. → ðæt PƏʊ-im ___ RI-tən ə-BAʊt ðiːz BJUː-ti-fəl hilz',es:'Se cree que ese poema se escribió sobre estas hermosas colinas. → Se cree que ese poema ___ escrito sobre estas hermosas colinas.',answer:'is believed to have been',hint:'Es una pasiva impersonal: People believe that… → It is believed that… / X is believed to…',why:'That poem is believed to have been written about these beautiful hills. Son cinco palabras en el hueco e incluyen HAVE sin modificar. Leti indicó que esta pasiva se estudiaría en otra clase.'},
{type:'transformación',keyword:'BEEN',prompt:'Without your help, I wouldn’t have finished the job. → I wouldn’t have finished the job if ___ your help.',phon:'wi-ðaʊt jɔː help, ai WUD-ənt hæv FI-nisht ðə dʒɒb. → ai WUD-ənt hæv FI-nisht ðə dʒɒb if ___ jɔː help',es:'Sin tu ayuda, no habría terminado el trabajo. → No habría terminado el trabajo si ___ tu ayuda.',answer:'it hadn’t been for',hint:'La expresión “if it had not been for” significa “si no hubiera sido por”.',why:'I wouldn’t have finished the job if it hadn’t been for your help. La respuesta tiene cuatro palabras e incluye BEEN sin modificarlo.'},
{type:'writing',prompt:'Write 3–4 sentences about something you regret and something you would like to change. Use a wish pattern.',phon:'rait θriː tə fɔː SEN-tən-siz ə-BAʊt Sʌm-θing juː ri-GRET ænd Sʌm-θing juː wəd laik tə tʃeindʒ. juːz ə wish PÆ-tən',es:'Escribe 3–4 frases sobre algo que lamentas y algo que te gustaría cambiar. Usa una estructura con wish.',solution:'I wish I had studied more. I wish I were more confident. I wish I had started earlier.',solutionPhon:'ai wish ai hæd STʌ-did mɔː. ai wish ai wɜː mɔː KɒN-fi-dənt. ai wish ai hæd STɑː-tid ɜː-li-ə',solutionEs:'Ojalá hubiera estudiado más. Ojalá tuviera más confianza. Ojalá hubiera empezado antes.',answer:'I wish I had studied more. I wish I were more confident. I wish I had started earlier.',accepted:['I wish I had studied more. I wish I were more confident. I wish I had started earlier.'],hint:'Incluye wish + past perfect para el lamento pasado y wish + past simple para un deseo presente.',why:'Modelo posible: “I wish I had studied more. I wish I were more confident. I wish I had started earlier.” No es la única respuesta válida: compara tus tiempos y estructura con el modelo.'}
]}
];
const state={active:0,answers:{},mistakes:[],lastPhrase:null};
const KEY='englishlab-leti-2026-10-05-v1';
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify({active:state.active,answers:state.answers,mistakes:state.mistakes}))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return (s||'').toLowerCase().replace(/[’‘']/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function say(text){state.lastPhrase=text;let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.88;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-GB')||null;speechSynthesis.cancel();speechSynthesis.speak(u)}
function phrase(p){const [en,phon,es]=p;return `<div class="phrase"><button class="audio" onclick="say(decodeURIComponent('${encodeURIComponent(en).replace(/'/g,'%27')}'))">▶ Escuchar</button><div class="english">${esc(en)}</div><div class="meta"><b>Pronunciación:</b> ${esc(phon)}</div><div class="meta"><b>Traducción:</b> ${esc(es)}</div><div style="clear:both"></div></div>`}
function update(){document.getElementById('nav').innerHTML=sections.map((s,i)=>`<button class="${i===state.active?'active':''}" onclick="go(${i})">${esc(s.nav)}</button>`).join('');const total=sections.reduce((n,s)=>n+s.quiz.length,0);const done=Object.values(state.answers).filter(a=>a.done).length;document.getElementById('progressCount').textContent=`${done} / ${total}`;document.getElementById('progressBar').style.width=(done/total*100)+'%';const wrong=state.mistakes.length;document.getElementById('wrongCount').textContent=wrong?`${wrong} respuesta${wrong===1?'':'s'} para repasar`:'Aún sin errores guardados';render()}
function go(i){state.active=i;save();update();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let s=sections[state.active];document.getElementById('content').innerHTML=`<span class="chip">${esc(s.badge)}</span><h1>${esc(s.title)}</h1><p class="lede">${esc(s.sub)}</p><section class="panel">${s.intro}</section>${s.examples.length?`<section class="panel"><h2>Frases de la clase</h2><p class="muted">Pulsa el botón para oírlas con una voz inglesa británica disponible en tu navegador.</p>${s.examples.map(phrase).join('')}</section>`:''}${s.vocab?`<section class="panel"><h2>Familias de palabras</h2><div class="vocab">${s.vocab.map(v=>`<div class="word"><strong>${esc(v[0])}</strong><small>${esc(v[1])}</small></div>`).join('')}</div></section>`:''}${s.quiz.length?`<section class="panel"><h2>Te toca</h2><p class="muted">Responde antes de abrir la corrección. Puedes pedir una pista, corregir tu respuesta y volver a intentarlo.</p>${s.quiz.map((q,j)=>quizCard(q,`s${state.active}q${j}`)).join('')}</section>`:''}<div class="footer-nav"><button class="secondary" onclick="go(${Math.max(0,state.active-1)})" ${state.active===0?'disabled':''}>Bloque anterior</button><button class="primary" onclick="go(${Math.min(sections.length-1,state.active+1)})" ${state.active===sections.length-1?'disabled':''}>Siguiente bloque</button></div>`}
function quizCard(q,id){const saved=state.answers[id]||{};const isText=['speaking','writing'].includes(q.type);const multi=['elegir respuesta','listening'].includes(q.type);const options=multi?`<div class="choices">${q.choices.map(c=>`<button class="choice ${saved.value===c?'selected':''}" onclick="choose('${id}','${encodeURIComponent(c)}',this)">${esc(c)}</button>`).join('')}</div>`:'';const keyword=q.keyword?`<div class="tag">Palabra clave: ${esc(q.keyword)} · no se modifica</div>`:'';const listening=['dictado','listening'].includes(q.type)?`<button class="secondary" onclick="say(decodeURIComponent('${encodeURIComponent(q.audio||q.answer).replace(/'/g,'%27')}'))">▶ ${q.type==='dictado'?'Escuchar dictado':'Reproducir audio'}</button>`:'';const mic=q.type==='speaking'?`<button class="secondary" onclick="listenMic('${id}')">🎙 Hablar</button><div class="mic-status" id="mic-${id}"></div>`:'';const answerbox=multi?'':`<${isText?'textarea':'input'} class="answer" id="ans-${id}" ${isText?'placeholder="Escribe aquí tu respuesta…"':'autocomplete="off" placeholder="Escribe tu respuesta…"'}>${isText?esc(saved.value||''):''}</${isText?'textarea':'input'}>`;return `<article class="qcard" id="card-${id}"><div class="qhead"><span class="typebadge">${esc(q.type)}</span>${keyword}</div>${q.type==='traducción'?`<div class="task">${esc(q.prompt)}</div>`:phrase([q.prompt,q.phon,q.es])}${listening}${options}${answerbox}<div class="qactions"><button class="primary" onclick="check('${id}')">Corregir</button><button class="secondary" onclick="hint('${id}')">Pista</button>${mic}<button class="secondary" onclick="retry('${id}')">Reintentar</button></div><div class="hint" id="hint-${id}">${esc(q.hint)}</div><div class="feedback ${saved.status==='good'?'show good':saved.status==='bad'?'show bad':''}" id="feedback-${id}">${saved.status==='good'?`<b>¡Correcto!</b> ${esc(q.why)}${solutionPhrase(q)}`:saved.status==='bad'?`<b>Revisa la respuesta.</b> ${esc(q.why)}${solutionPhrase(q)}`:''}</div></article>`}
function solutionPhrase(q){if(!q.solution)return `<div class="explanation"><b>Respuesta correcta:</b> ${esc(q.answer)}</div>`;return `<div class="explanation"><b>Frase completa:</b>${phrase([q.solution,q.solutionPhon||q.phon,q.solutionEs||q.es])}</div>`}
function choose(id,v,el){v=decodeURIComponent(v);document.querySelectorAll('#card-'+id+' .choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');state.answers[id]={...(state.answers[id]||{}),value:v};save()}
function valueFor(id){let selected=document.querySelector('#card-'+id+' .choice.selected');if(selected)return selected.textContent.trim();return document.getElementById('ans-'+id)?.value||''}
function questionFor(id){let [_,si,qi]=id.match(/^s(\d+)q(\d+)$/)||[];return sections[Number(si)]?.quiz[Number(qi)]}
function check(id){const q=questionFor(id);let v=valueFor(id).trim();if(!v){alert('Escribe o selecciona primero tu respuesta.');return}const fb=document.getElementById('feedback-'+id);let valid=true;
if(q.keyword){const words=v.split(/\s+/).filter(Boolean);if(words.length<2||words.length>5){fb.className='feedback show neutral';fb.innerHTML='La respuesta debe contener entre 2 y 5 palabras en el hueco. Cuenta también la palabra clave.';return}const kw=q.keyword.toLowerCase();if(!words.some(w=>norm(w)===norm(kw))){fb.className='feedback show neutral';fb.innerHTML=`Debes conservar la palabra <b>${esc(q.keyword)}</b> exactamente, sin cambiarla.`;return}}
if(q.type==='writing'){valid=v.split(/\s+/).length>=12&&/wish/i.test(v)}else{let candidates=[q.answer,...(q.accepted||[])];valid=candidates.some(a=>norm(v)===norm(a))}
let previous=state.answers[id]||{};state.answers[id]={...previous,value:v,status:valid?'good':'bad',done:valid||previous.done};if(!valid&&!state.mistakes.some(m=>m.id===id)){state.mistakes.push({id,section:sections[state.active].title,prompt:q.prompt})}if(valid)state.mistakes=state.mistakes.filter(m=>m.id!==id);save();fb.className='feedback show '+(valid?'good':'bad');fb.innerHTML=`<b>${valid?'¡Correcto!':'Todavía no.'}</b> ${esc(q.why)}${solutionPhrase(q)}`;updateProgressOnly()}
function updateProgressOnly(){const total=sections.reduce((n,s)=>n+s.quiz.length,0);const done=Object.values(state.answers).filter(a=>a.done).length;document.getElementById('progressCount').textContent=`${done} / ${total}`;document.getElementById('progressBar').style.width=(done/total*100)+'%';document.getElementById('wrongCount').textContent=state.mistakes.length?`${state.mistakes.length} respuesta${state.mistakes.length===1?'':'s'} para repasar`:'Aún sin errores guardados'}
function hint(id){document.getElementById('hint-'+id).classList.toggle('show')}
function retry(id){let a=state.answers[id]||{};a.status='';a.value='';state.answers[id]=a;save();render()}
function listenMic(id){const box=document.getElementById('ans-'+id);const out=document.getElementById('mic-'+id);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){out.textContent='El reconocimiento de voz no está disponible en este navegador. Escribe lo que has dicho.';return}const r=new SR();r.lang='en-GB';r.onresult=e=>{box.value=e.results[0][0].transcript;out.textContent='He oído: '+e.results[0][0].transcript};r.onerror=()=>out.textContent='No he podido oírte. Comprueba el permiso del micrófono o escribe la frase.';r.start();out.textContent='Te escucho…'}
function review(){let m=state.mistakes;if(!m.length){alert('Todavía no hay errores guardados. Cuando una respuesta sea incorrecta, aparecerá aquí.');return}let html='<h2>Repaso de errores</h2><p class="muted">Vuelve a la pregunta con un toque y prueba otra vez.</p>'+m.map(x=>`<div class="review-item"><b>${esc(x.section)}</b><br>${esc(x.prompt)}<br><button class="secondary" onclick="go(${sections.findIndex(s=>s.title===x.section)});setTimeout(()=>document.getElementById('${x.id}')?.scrollIntoView({behavior:'smooth'}),100)">Ir a la actividad</button></div>`).join('');document.getElementById('content').innerHTML=`<section class="panel">${html}</section><button class="secondary" onclick="go(${state.active})">Volver al bloque</button>`}
document.getElementById('reviewBtn').onclick=review;document.getElementById('resetBtn').onclick=()=>{if(confirm('¿Borrar todas las respuestas guardadas en este dispositivo?')){localStorage.removeItem(KEY);state.answers={};state.mistakes=[];update()}};document.getElementById('voiceBtn').onclick=()=>state.lastPhrase?say(state.lastPhrase):say('Welcome to English Lab. Let us practise.');
update();
</script></body></html>
